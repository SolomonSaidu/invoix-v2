<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- App Background with Soft Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="#4f46e5"/>
  
  <!-- Subtle Gradient Overlay -->
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- White Paper Document with drop shadow -->
  <rect x="132" y="112" width="248" height="288" rx="28" fill="url(#paperGrad)" filter="url(#shadow)"/>

  <!-- Document Header Bar -->
  <rect x="172" y="168" width="168" height="24" rx="12" fill="#4f46e5"/>

  <!-- Document Line 2 -->
  <rect x="172" y="218" width="168" height="20" rx="10" fill="#818cf8"/>

  <!-- Document Line 3 (Shorter) -->
  <rect x="172" y="264" width="100" height="20" rx="10" fill="#c7d2fe"/>

  <!-- Cyan Accent Status Badge with Drop Shadow -->
  <circle cx="348" cy="348" r="56" fill="#38bdf8" filter="url(#shadow)"/>
  <circle cx="348" cy="348" r="20" fill="#ffffff"/>
</svg>
